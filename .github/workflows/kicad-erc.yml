name: KiCad ERC Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  erc-check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup just
        uses: extractions/setup-just@v2

      - name: Run ERC and DRC
        run: just check
